name: Build APK

on:
  push:
    branches: [ custom ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: "Checkstyle and Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Checkstyle and Lint
        run: ./gradlew checkstyle lint

  apk:
    name: "Build PlayDebug APK"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Build
        run: ./gradlew assemblePlayDebug
      - name: Read version
        id: version
        run: |
          VERSION=$(grep -m1 'versionCode' app/build.gradle | grep -oE '[0-9]+' | head -1)
          NAMED=$(grep -m1 'versionName' app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          echo "label=${NAMED}+${VERSION}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antennapod-custom-play-debug
          path: app/build/outputs/apk/play/debug/app-play-debug.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest app/build/outputs/apk/play/debug/app-play-debug.apk \
            --title "Custom build ${{ steps.version.outputs.label }}" \
            --notes "PlayDebug APK built from the custom branch.

          Customizations on top of upstream develop:
          - Continue playing when opening the app (Settings > Playback > Playback control)
          - Scheduled playback speed during a set time of day
          - Mini player play/pause button centered in landscape

          Signed with the default debug key, so it installs over another debug build but not over the official release app."
