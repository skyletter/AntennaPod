name: Build APK

on:
  push:
    branches: [ custom ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  checks:
    name: "Checkstyle and Lint"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Checkstyle and Lint
        run: ./gradlew checkstyle lint

  apk:
    name: "Build signed PlayRelease APK"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle/wrapper/gradle-wrapper.properties') }}
      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. Cannot sign a release build."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore
          test -s app/keystore
      - name: Build
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assemblePlayRelease \
            -PreleaseStoreFile=keystore \
            -PreleaseStorePassword="$STORE_PASSWORD" \
            -PreleaseKeyAlias="$KEY_ALIAS" \
            -PreleaseKeyPassword="$KEY_PASSWORD"
      - name: Verify signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/play/release/app-play-release.apk
      - name: Read version
        id: version
        run: |
          NAMED=$(grep -m1 'versionName' app/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          CODE=$(grep -m1 'versionCode' app/build.gradle | grep -oE '[0-9]+' | head -1)
          echo "label=${NAMED}+${CODE}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: antennapod-custom-play-release
          path: app/build/outputs/apk/play/release/app-play-release.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest app/build/outputs/apk/play/release/app-play-release.apk \
            --title "Custom build ${{ steps.version.outputs.label }}" \
            --notes "Signed release APK built from the custom branch.

          Customizations on top of upstream develop:
          - Continue playing when opening the app (Settings > Playback > Playback control)
          - Scheduled playback speed during a set time of day
          - Mini player play/pause button centered in landscape
          - Simplified Chinese translations for the settings above

          Package name is de.danoeh.antennapod (release build, R8 minified), so the app
          shows as AntennaPod with no development-version notice. It conflicts with an
          official AntennaPod install and is signed with a private key that is not the
          official one, so it cannot be upgraded from Play/F-Droid. Keep using this
          release for future upgrades."
